# Konfigurasi Railway untuk service backend (Root Directory: backend). Lihat docs/DEPLOYMENT.md §8.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Seed idempoten tiap deploy: index, role/permission, aturan poin, admin pertama (ADMIN_PHONE/PIN).
preDeployCommand = ["python -m app.seed"]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# Satu instance: presence Reading Room & rate limit disimpan di memori proses.
numReplicas = 1
