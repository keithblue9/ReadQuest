# Render Blueprint: backend ReadQuest (FastAPI) di paket Free.
# Render Dashboard → New → Blueprint → pilih repo ini. Panduan: docs/DEPLOYMENT.md §8.
services:
  - type: web
    name: readquest-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install uv==0.8.17 && uv sync --locked --no-dev
    # Soket dual-stack di $PORT (diisi Render); IP klien dari X-Forwarded-For.
    startCommand: .venv/bin/python -m app.serve
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Foto disimpan di MongoDB (disk Render tidak permanen).
      - key: STORAGE_BACKEND
        value: mongo
      # Paket Free tidak punya pre-deploy command: seed idempoten dijalankan saat start.
      - key: SEED_ON_STARTUP
        value: "true"
      - key: MONGODB_DB
        value: readquest
      - key: JWT_SECRET
        generateValue: true
      # Diisi manual di Dashboard (rahasia / bergantung alamat Vercel):
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
