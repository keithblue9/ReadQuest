# Layanan pendukung untuk pengembangan lokal: MongoDB + object storage S3-compatible.
# Aplikasi frontend/backend dijalankan terpisah (lihat README masing-masing).
# Kredensial object storage dibaca dari .env di root (salin dari .env.example).

services:
  mongo:
    image: mongo:7
    # Replica set satu node agar transaksi multi-dokumen bisa dipakai.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  # RustFS: object storage S3-compatible (Apache-2.0), pengganti MinIO yang image
  # komunitasnya tidak lagi dipublikasikan. Bucket dibuat otomatis oleh backend.
  storage:
    image: rustfs/rustfs:1.0.0
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set di .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set di .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage-data:/data

volumes:
  mongo-data:
  storage-data:
