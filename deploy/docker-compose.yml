# Stack production ReadQuest dalam satu host (VPS) dengan HTTPS otomatis.
#   cd deploy && cp .env.example .env   # isi nilainya
#   docker compose up -d --build
#   docker compose --profile tools run --rm seed   # sekali: role, aturan poin, admin pertama
# Panduan lengkap: docs/DEPLOYMENT.md

name: readquest-prod

x-backend-env: &backend-env
  APP_ENV: production
  FRONTEND_ORIGIN: https://${DOMAIN:?isi DOMAIN di deploy/.env}
  COOKIE_SECURE: "true"
  MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
  MONGODB_DB: ${MONGODB_DB:-readquest}
  JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET (min. 32 karakter)}
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://storage:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?isi S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?isi S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-readquest-photos}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_NAME: ${ADMIN_NAME:-Admin}
  SEED_INVITE_CODE: ${SEED_INVITE_CODE:-}

services:
  # Reverse proxy + sertifikat TLS otomatis (Let's Encrypt). Satu-satunya layanan yang membuka port.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]

  frontend:
    build:
      context: ../frontend
      args:
        API_PROXY_TARGET: http://backend:8000
    image: readquest-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, app]

  backend:
    build: ../backend
    image: readquest-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Backend hanya bisa dijangkau frontend lewat jaringan internal, jadi X-Forwarded-For
      # (diisi Caddy, diteruskan Next.js) boleh dipercaya untuk IP klien & rate limit.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      mongo:
        condition: service_healthy
      storage:
        condition: service_started
    # Satu instance: scheduler memakai lease di MongoDB, tetapi Reading Room & rate limit di memori.
    networks: [app, data]

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Replica set satu node (transaksi multi-dokumen). Tidak membuka port ke luar host.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks: [data]

  # Object storage S3-compatible untuk foto buku. Bisa diganti S3/R2 (ubah S3_ENDPOINT_URL).
  storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    networks: [data]

  # Seed data awal (idempoten). Jalankan: docker compose --profile tools run --rm seed
  seed:
    image: readquest-backend:${TAG:-latest}
    profiles: [tools]
    command: ["python", "-m", "app.seed"]
    environment:
      <<: *backend-env
      SCHEDULER_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [data]

networks:
  edge: {}
  app: {}
  # Database & storage tanpa akses internet dan tanpa port publik.
  data:
    internal: true

volumes:
  mongo-data:
  storage-data:
  caddy-data:
  caddy-config:
