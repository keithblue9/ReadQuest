name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB (replica set satu node)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && break
            sleep 1
          done

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Build image production & smoke test stack lengkap (Caddy HTTPS → Next.js → FastAPI → Mongo/RustFS).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: readquest-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build image frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: readquest-frontend:latest
          build-args: API_PROXY_TARGET=http://backend:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Jalankan stack production (DOMAIN=localhost, sertifikat internal Caddy)
        working-directory: deploy
        run: |
          cat > .env <<ENV
          DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          S3_ACCESS_KEY=readquest
          S3_SECRET_KEY=$(openssl rand -hex 16)
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=ci-admin-123
          SEED_INVITE_CODE=CITEST
          ENV
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose --profile tools run --rm seed

      - name: Smoke test
        run: |
          curl -fsSk -o /dev/null https://localhost/login
          curl -fsSkI https://localhost/login | grep -qi "strict-transport-security"
          curl -fsSkI https://localhost/login | grep -qi "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
          curl -fsSk -X POST https://localhost/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"ci-admin-123"}' | grep -q access_token

      - name: Log container (bila gagal)
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color
